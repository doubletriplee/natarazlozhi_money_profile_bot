services:
  app:
    image: ${APP_IMAGE:-natarazlozhi-money-profile-bot:local}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AVATAR_ASSET_DIRECTORY: /app/assets/avatars
      PDF_OUTPUT_DIRECTORY: /data/pdfs
      BACKUP_STATUS_PATH: /data/backups/status.json
    depends_on:
      telegram-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./runtime/data:/data
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: ${APP_IMAGE:-natarazlozhi-money-profile-bot:local}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_DESTINATION: /data/backups
      BACKUP_STATUS_PATH: /data/backups/status.json
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-8}
    command: ["python", "scripts/backup_worker.py"]
    volumes:
      - ./runtime/data:/data
    cpus: 0.2
    mem_limit: 768m
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "scripts/backup_worker.py", "--check"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s

  telegram-proxy:
    image: ${TELEGRAM_PROXY_IMAGE:-money-profile-telegram-proxy:local}
    build:
      context: ./deploy/telegram-proxy
    restart: unless-stopped
    command:
      - -NT
      - -D
      - 0.0.0.0:1080
      - -o
      - BatchMode=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=20
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/run/ssh/known_hosts
      - -i
      - /run/ssh/id_ed25519
      - tgproxy@${TELEGRAM_PROXY_HOST}
    volumes:
      - ./runtime/ssh:/run/ssh:ro
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
