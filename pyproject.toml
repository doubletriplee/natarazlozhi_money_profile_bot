[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natarazlozhi-money-profile-bot"
version = "0.1.0"
description = "Telegram bot that builds a deterministic astrological money profile"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
authors = [{ name = "doubletriplee" }]
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.10,<4",
  "aiohttp-socks>=0.10,<1",
  "aiosqlite>=0.20,<1",
  "cryptography>=50.0.1,<51",
  "defusedxml>=0.7.1,<1",
  "Pillow>=11,<13",
  "pydantic-settings>=2.6,<3",
  "pyswisseph==2.10.3.2",
  "python-dateutil>=2.9,<3",
  "reportlab>=4.2,<5",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.10.1,<3",
  "pypdf>=5,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "types-defusedxml>=0.7.0.20260504,<1",
  "types-reportlab>=4.2,<5",
]

[project.scripts]
money-profile-bot = "money_profile_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/money_profile_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["money_profile_bot"]
